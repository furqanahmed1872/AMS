name: Weekly DB Backup

on:
  schedule:
    - cron: "0 2 * * 0"  # every Sunday, 2 AM UTC
  workflow_dispatch:      # lets you trigger it manually to test

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        run: |
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" -Fc -f ams_backup.dump

      - name: Checkout backups repo
        uses: actions/checkout@v4
        with:
          repository: YOUR_GITHUB_USERNAME/ams-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: ams-backups

      - name: Commit and push backup
        run: |
          mkdir -p ams-backups/backups
          mv ams_backup.dump ams-backups/backups/ams_backup_$(date +%Y%m%d).dump
          cd ams-backups
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git commit -m "Weekly backup $(date +%Y-%m-%d)"
          git push